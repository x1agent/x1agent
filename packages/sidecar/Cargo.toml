[package]
name = "x1agent-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
async-nats = "0.42"
base64 = "0.22"
bytes = "1"
# Sentry uses native-tls (openssl). Alpine builder has openssl-dev +
# openssl-libs-static so the build works. Tried `rustls` feature first
# but rustls 0.23 demands an explicit CryptoProvider that sentry's
# feature-gating doesn't pick — caused a runtime panic on init.
sentry = "0.48"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
jsonwebtoken = "9"
once_cell = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
