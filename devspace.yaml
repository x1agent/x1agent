version: v2beta1
name: x1agent

# Local dev puts the API (and Postgres) into the OrbStack K8s cluster so
# that session Jobs can be created from the same ServiceAccount + NATS bus
# that prod will use. The Astro app runs on the host (Vite HMR is snappier
# outside a container, and the app only talks to the API over HTTP).
#
# This config is DEV ONLY. Prod deployment goes through the Helm chart at
# deploy/helm/x1agent/. Secrets here flow from .env.local → mise →
# devspace vars → pod env; prod uses External Secrets Operator.

vars:
  JWT_SECRET:
    source: env
  GOOGLE_OAUTH_CLIENT_ID:
    source: env
  GOOGLE_OAUTH_CLIENT_SECRET:
    source: env
  # Space-separated OAuth scope list. Defaults to identity-only
  # (openid/email/profile) inside the api when unset. Add downstream-
  # API scopes (drive.readonly, calendar, gmail.modify, etc.) when
  # the operator wants the Google Workspace provider to act on the
  # user's behalf. Re-consent at next sign-in.
  GOOGLE_OAUTH_SCOPES:
    source: env
    default: ""
  ALLOWED_DOMAINS:
    source: env
    default: ""
  PLATFORM_ADMIN_EMAILS:
    source: env
    default: ""
  AUTH_BYPASS:
    source: env
    default: "false"
  TEST_USER:
    source: env
    default: ""
  GITHUB_APP_ID:
    source: env
    default: ""
  GITHUB_APP_SLUG:
    source: env
    default: ""
  GITHUB_APP_CLIENT_ID:
    source: env
    default: ""
  GITHUB_APP_CLIENT_SECRET:
    source: env
    default: ""
  GITHUB_APP_PRIVATE_KEY:
    source: env
    default: ""
  GITHUB_APP_WEBHOOK_SECRET:
    source: env
    default: ""
  ANTHROPIC_API_KEY:
    source: env
    default: ""
  # Optional fallback for the session summarizer (and any future
  # OpenAI-powered embedding work). When set in `.env.local` and
  # ANTHROPIC_API_KEY is empty, the api will use this for periodic
  # session-summary refreshes.
  OPENAI_API_KEY:
    source: env
    default: ""
  # AES-256-GCM key for the workspace-secrets domain. Generate with
  # `openssl rand -hex 32`. Used by the api at boot to decrypt secrets
  # the operator pastes into workspace settings (e.g. Stripe key for
  # MCP attachments). Loss of this key = loss of every encrypted
  # workspace secret in postgres.
  WORKSPACE_SECRETS_MASTER_KEY:
    source: env
  API_INTERNAL_TOKEN:
    source: env
    default: "dev-internal-token-change-me"
  # Phase 1 messaging provider credential. Phase 2 replaces this with
  # per-workspace OAuth + credential proxy.
  SLACK_BOT_TOKEN:
    source: env
    default: ""

images:
  api:
    image: x1agent-api
    tags:
      - latest
    dockerfile: ./deploy/docker/api.dev.Dockerfile
    context: .
    rebuildStrategy: ignoreContextChanges
  agent:
    image: x1agent-agent
    tags:
      - latest
    dockerfile: ./packages/agent/Dockerfile
    context: ./packages/agent
    rebuildStrategy: ignoreContextChanges
  sidecar:
    image: x1agent-sidecar
    tags:
      - latest
    dockerfile: ./packages/sidecar/Dockerfile
    context: ./packages/sidecar
    rebuildStrategy: ignoreContextChanges
  messaging-slack:
    image: x1agent-provider-messaging-slack
    tags:
      - latest
    dockerfile: ./deploy/docker/messaging-slack.dev.Dockerfile
    context: .
    rebuildStrategy: ignoreContextChanges
  graph-surrealdb:
    image: x1agent-provider-graph-surrealdb
    tags:
      - latest
    dockerfile: ./deploy/docker/graph-surrealdb.dev.Dockerfile
    context: .
    rebuildStrategy: ignoreContextChanges
  preview:
    image: x1agent-provider-preview
    tags:
      - latest
    dockerfile: ./deploy/docker/preview.dev.Dockerfile
    context: .
    rebuildStrategy: ignoreContextChanges
  # Sibling-container proxy that holds per-user OAuth bearers for
  # remote_oauth MCP attachments (Linear, Sentry, Notion, …). The
  # job-watcher injects this image into the session pod spec; if the
  # tag isn't present in the local docker daemon, every session that
  # attaches a remote_oauth MCP gets stuck in ImagePullBackOff and the
  # MCP appears dead to the agent. Has to be built alongside agent
  # and sidecar for any local session that uses Zone-3 MCPs.
  mcp-oauth-proxy:
    image: x1agent-mcp-oauth-proxy
    tags:
      - latest
    dockerfile: ./deploy/docker/mcp-oauth-proxy.dev.Dockerfile
    context: .
    rebuildStrategy: ignoreContextChanges
  # Google Workspace provider — Drive (v1), Docs/Sheets/Calendar/Gmail
  # in subsequent phases. Subscribes to x1.provider.{files,documents,
  # calendar,email}.* over NATS. Per-call user OAuth via the api's
  # /api/internal/user-oauth-token (Phase 0 substrate). Session pods
  # never import Google API code.
  google-workspace:
    image: x1agent-provider-google-workspace
    tags:
      - latest
    dockerfile: ./deploy/docker/google-workspace.dev.Dockerfile
    context: .
    rebuildStrategy: ignoreContextChanges
  app:
    image: x1agent-app
    tags:
      - latest
    dockerfile: ./deploy/docker/app.dev.Dockerfile
    context: .
    rebuildStrategy: ignoreContextChanges

deployments:
  postgres:
    kubectl:
      manifests:
        - deploy/k8s/dev/postgres.yaml
  nats:
    kubectl:
      manifests:
        - deploy/k8s/dev/nats.yaml
  api:
    kubectl:
      manifests:
        - deploy/k8s/dev/api.yaml
    # Mirror deploy/images into the running api pod so seed.ts can read
    # the Dockerfile text for each preset without rebuilding the image.
    # Matches the `deploy/migrations` sync pattern below.
  messaging-slack:
    kubectl:
      manifests:
        - deploy/k8s/dev/messaging-slack.yaml
  google-workspace:
    kubectl:
      manifests:
        - deploy/k8s/dev/google-workspace.yaml
  surrealdb:
    kubectl:
      manifests:
        - deploy/k8s/dev/surrealdb.yaml
  graph-surrealdb:
    kubectl:
      manifests:
        - deploy/k8s/dev/graph-surrealdb.yaml
  preview:
    kubectl:
      manifests:
        - deploy/k8s/dev/preview.yaml
  coredns-rewrite:
    kubectl:
      manifests:
        - deploy/k8s/dev/coredns-rewrite.yaml
  registry:
    kubectl:
      manifests:
        - deploy/k8s/dev/registry.yaml
  networkpolicy:
    kubectl:
      manifests:
        - deploy/k8s/dev/networkpolicy.yaml
  app:
    kubectl:
      manifests:
        - deploy/k8s/dev/app.yaml
  # cert-manager Issuer + root CA Certificate for *.local.x1agent.dev.
  # Applied by deploy/scripts/bootstrap-cert-manager.sh first (mise
  # dev:cert-manager runs before dev:setup); re-applying here is a no-op.
  # Keeping it in the deployments list means `devspace deploy --dependent`
  # / fresh-cluster runs don't drift.
  cert-manager-issuer:
    kubectl:
      manifests:
        - deploy/k8s/dev/cert-manager.yaml
  # Ingress + leaf Certificate (cert-manager auto-creates secret
  # x1agent-wildcard from the local CA Issuer above).
  ingress:
    kubectl:
      manifests:
        - deploy/k8s/dev/ingress.yaml

dev:
  # Port-forward Postgres to the host so integration tests + migration
  # tools (`bun run migrate` from the host) can reach the cluster DB.
  postgres:
    labelSelector:
      app: postgres
    ports:
      - port: "5432"

  # NATS: :4222 for clients (api, tooling), :8080 for the browser
  # WebSocket used by the session viewer.
  nats:
    labelSelector:
      app: nats
    ports:
      - port: "4222"
      - port: "8080"

  api:
    labelSelector:
      app: api
    devImage: x1agent-api
    sync:
      - path: ./packages:/app/packages
        excludePaths:
          - node_modules
          - dist
          - .astro
          - "*.log"
        startContainer: true
      - path: ./deploy/migrations:/app/deploy/migrations
      - path: ./deploy/images:/app/deploy/images
    ports:
      - port: "30001"
    # The image already has node_modules installed; file sync overlays
    # packages/ with the host's current source. We just migrate + start.
    command:
      - sh
      - -c
      - |
        set -e
        cd /app
        (cd packages/api && bun run migrate)
        exec bun --hot run packages/api/src/index.ts
    env:
      - name: JWT_SECRET
        value: ${JWT_SECRET}
      - name: GOOGLE_OAUTH_CLIENT_ID
        value: ${GOOGLE_OAUTH_CLIENT_ID}
      - name: GOOGLE_OAUTH_CLIENT_SECRET
        value: ${GOOGLE_OAUTH_CLIENT_SECRET}
      - name: GOOGLE_OAUTH_SCOPES
        value: ${GOOGLE_OAUTH_SCOPES}
      - name: ALLOWED_DOMAINS
        value: ${ALLOWED_DOMAINS}
      - name: PLATFORM_ADMIN_EMAILS
        value: ${PLATFORM_ADMIN_EMAILS}
      - name: AUTH_BYPASS
        value: ${AUTH_BYPASS}
      - name: TEST_USER
        value: ${TEST_USER}
      - name: GITHUB_APP_ID
        value: ${GITHUB_APP_ID}
      - name: GITHUB_APP_SLUG
        value: ${GITHUB_APP_SLUG}
      - name: GITHUB_APP_CLIENT_ID
        value: ${GITHUB_APP_CLIENT_ID}
      - name: GITHUB_APP_CLIENT_SECRET
        value: ${GITHUB_APP_CLIENT_SECRET}
      - name: GITHUB_APP_PRIVATE_KEY
        value: ${GITHUB_APP_PRIVATE_KEY}
      - name: GITHUB_APP_WEBHOOK_SECRET
        value: ${GITHUB_APP_WEBHOOK_SECRET}
      - name: ANTHROPIC_API_KEY
        value: ${ANTHROPIC_API_KEY}
      - name: OPENAI_API_KEY
        value: ${OPENAI_API_KEY}
      - name: WORKSPACE_SECRETS_MASTER_KEY
        value: ${WORKSPACE_SECRETS_MASTER_KEY}
      - name: NATS_URL
        value: nats://nats:4222
      - name: NATS_CA_FILE
        value: /etc/nats-tls/ca.crt
      - name: NATS_CLIENT_CERT
        value: /etc/nats-tls/client.crt
      - name: NATS_CLIENT_KEY
        value: /etc/nats-tls/client.key
      - name: API_INTERNAL_TOKEN
        value: ${API_INTERNAL_TOKEN}
      - name: K8S_SKIP_TLS_VERIFY
        value: "true"
      # bun's TLS stack ignores skipTLSVerify from the k8s client config.
      # Dev-only knob that makes it accept OrbStack's self-signed cert.
      - name: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
      - name: K8S_NAMESPACE
        value: x1agent
      - name: IMAGE_PULL_POLICY
        value: IfNotPresent
      # Capability gating mirrors the Helm chart so /api/capabilities
      # reports the same backends in dev as it would on a prod install.
      # surrealdb is the only graph provider in v1 and it implements
      # vector too — both point at the same Deployment.
      - name: PROVIDER_GRAPH
        value: surrealdb
      - name: PROVIDER_VECTOR
        value: surrealdb
      # Wave 1 of rfcs/jetstream-migration.md. Local dev exercises the
      # JetStream publish path so we catch publisher-side bugs (missing
      # ack, msg-id collision, stream back-pressure) before they ship in
      # the chart. USE_JETSTREAM_CONSUME makes new session pods get a
      # durable consumer; existing sessions stay on their core path
      # until they reach a terminal state.
      - name: USE_JETSTREAM_PUBLISH
        value: "true"
      - name: USE_JETSTREAM_CONSUME
        value: "true"

  messaging-slack:
    labelSelector:
      app: messaging-slack
    devImage: x1agent-provider-messaging-slack
    sync:
      - path: ./packages:/app/packages
        excludePaths:
          - node_modules
          - dist
          - "*.log"
        startContainer: true
    command:
      - sh
      - -c
      - |
        set -e
        cd /app
        exec bun --hot run packages/providers/messaging-slack/src/index.ts
    env:
      - name: NATS_URL
        value: nats://nats:4222
      - name: NATS_CA_FILE
        value: /etc/nats-tls/ca.crt
      - name: NATS_CLIENT_CERT
        value: /etc/nats-tls/client.crt
      - name: NATS_CLIENT_KEY
        value: /etc/nats-tls/client.key
      - name: SLACK_BOT_TOKEN
        value: ${SLACK_BOT_TOKEN}

  google-workspace:
    labelSelector:
      app: google-workspace
    devImage: x1agent-provider-google-workspace
    sync:
      - path: ./packages:/app/packages
        excludePaths:
          - node_modules
          - dist
          - "*.log"
        startContainer: true
    command:
      - sh
      - -c
      - |
        set -e
        cd /app
        exec bun --hot run packages/providers/google-workspace/src/index.ts
    env:
      - name: NATS_URL
        value: nats://nats:4222
      - name: NATS_CA_FILE
        value: /etc/nats-tls/ca.crt
      - name: NATS_CLIENT_CERT
        value: /etc/nats-tls/client.crt
      - name: NATS_CLIENT_KEY
        value: /etc/nats-tls/client.key
      - name: X1_API_URL
        value: http://api:30001
      - name: API_INTERNAL_TOKEN
        value: ${API_INTERNAL_TOKEN}

  graph-surrealdb:
    labelSelector:
      app: graph-surrealdb
    devImage: x1agent-provider-graph-surrealdb
    sync:
      - path: ./packages:/app/packages
        excludePaths:
          - node_modules
          - dist
          - "*.log"
        startContainer: true
    command:
      - sh
      - -c
      - |
        set -e
        cd /app
        exec bun --hot run packages/providers/graph-surrealdb/src/index.ts
    env:
      - name: NATS_URL
        value: nats://nats:4222
      - name: NATS_CA_FILE
        value: /etc/nats-tls/ca.crt
      - name: NATS_CLIENT_CERT
        value: /etc/nats-tls/client.crt
      - name: NATS_CLIENT_KEY
        value: /etc/nats-tls/client.key
      - name: SURREAL_URL
        value: http://surrealdb:8000
      - name: SURREAL_USER
        value: root
      - name: SURREAL_PASS
        value: x1agent-surreal-root
      - name: SURREAL_NAMESPACE
        value: x1agent

  preview:
    labelSelector:
      app: preview
    devImage: x1agent-provider-preview
    sync:
      - path: ./packages:/app/packages
        excludePaths:
          - node_modules
          - dist
          - "*.log"
        startContainer: true
    command:
      - sh
      - -c
      - |
        set -e
        cd /app
        exec bun --hot run packages/providers/preview/src/index.ts
    env:
      - name: NATS_URL
        value: nats://nats:4222
      - name: NATS_CA_FILE
        value: /etc/nats-tls/ca.crt
      - name: NATS_CLIENT_CERT
        value: /etc/nats-tls/client.crt
      - name: NATS_CLIENT_KEY
        value: /etc/nats-tls/client.key
      - name: API_URL
        value: http://api:30001
      - name: API_INTERNAL_TOKEN
        value: ${API_INTERNAL_TOKEN}
      - name: REGISTRY_ADDRESS
        value: x1-registry.x1agent.svc.cluster.local:5000
      - name: REGISTRY_INSECURE
        value: "true"
      - name: BUILD_NAMESPACE
        value: x1agent
      - name: PREVIEW_NAMESPACE
        value: x1-previews
      - name: PREVIEW_DOMAIN
        value: preview.local.x1agent.dev
      - name: TLS_SECRET_NAME
        value: x1agent-wildcard

  app:
    labelSelector:
      app: app
    devImage: x1agent-app
    sync:
      - path: ./packages:/app/packages
        excludePaths:
          - node_modules
          - dist
          - .astro
          - "*.log"
        startContainer: true
    command:
      - sh
      - -c
      - |
        set -e
        cd /app/packages/app
        exec bun run dev
    env:
      - name: PUBLIC_API_URL
        value: https://api.local.x1agent.dev
      - name: PUBLIC_URL
        value: https://app.local.x1agent.dev
      - name: NODE_ENV
        value: development
      - name: HOST
        value: "0.0.0.0"

pipelines:
  dev: |-
    run_dependencies --all
    create_deployments --all
    start_dev --all
