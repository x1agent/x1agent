# X1A-46 — Admin Settings → LLM Provider Keys overlay Secret.
#
# Source of truth for admin-edited platform keys (OPENAI_API_KEY,
# ANTHROPIC_API_KEY today; more providers extend the same shape).
# Mounted by the api Deployment via envFrom AFTER x1agent-secrets so
# its keys shadow the ESO-synced values when an admin saves a new
# value through /admin/settings.
#
# Why this is its OWN Secret, not added to x1agent-secrets:
#
#   - x1agent-secrets is owned by the ExternalSecret/x1agent-secrets
#     resource (creationPolicy: Owner). ESO will overwrite that
#     Secret's data on every refresh interval, clobbering anything
#     the api wrote on top.
#   - This Secret is plain (no ExternalSecret owner), so the api
#     can patch it freely. The annotation here is the standard
#     helm "keep what's already there on upgrade" marker — admin
#     edits survive `helm upgrade` rolls of the chart.
#
# RBAC: the api ServiceAccount gets secrets create/get/list/watch/
# patch/delete via the Role in api.yaml; no extra binding needed.
apiVersion: v1
kind: Secret
metadata:
  name: x1agent-platform-secrets
  labels: {{- include "x1agent.labels" . | nindent 4 }}
  annotations:
    # Helm treats this annotation as "do not own this resource on
    # upgrade or uninstall". Admin-edited keys persist across chart
    # bumps; an explicit `helm uninstall` of the whole release will
    # leave the Secret in the namespace, requiring `kubectl delete`
    # if the operator wants a true reset. That's the right default —
    # surprise-clearing of admin-edited platform keys would be worse
    # than the cleanup cost.
    "helm.sh/resource-policy": keep
type: Opaque
# No `data:` block: the api writes individual keys via patch on the
# first save. The api Deployment's envFrom: { secretRef: …, optional: true }
# means a totally empty Secret (or a missing one on dev installs) still
# rolls cleanly.
