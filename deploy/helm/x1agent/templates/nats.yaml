# In-cluster NATS with mTLS. cert-manager issues the server cert (see
# nats-certs.yaml) into the `nats-server-tls` Secret; we mount it +
# the internal CA Secret here. Single replica for v1; clustered NATS
# is a follow-up.
#
# `verify_and_map: true` extracts the client cert's CN as the NATS
# username + matches against the authorization.users block. Subject
# ACLs follow the docs/configuration/nats-mtls.md design.
{{- if .Values.infra.nats.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "x1agent.selectorLabels" (dict "ctx" . "component" "nats") | nindent 4 }}
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: ws
      port: 8080
      targetPort: 8080
---
{{- $nats := .Values.infra.nats -}}
{{- $js := default (dict) $nats.jetstream -}}
{{- $jsEnabled := and (default false $js.enabled) (gt (int (default 1 $nats.replicas)) 0) -}}
{{- $replicas := int (default 1 $nats.replicas) -}}
{{- /*
NATS pod shape branches on:
  - replicas > 1  -> StatefulSet (per-pod PVCs via volumeClaimTemplates,
                     headless service for peer discovery)
  - replicas = 1  -> Deployment (Recreate strategy + a single PVC when
                     JetStream is enabled)
JetStream's stream + consumer state lives on the PV; emptyDir defeats
the durability guarantee, so PVC is non-negotiable when jetstream is on.
*/}}
{{- if eq $replicas 1 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Single-replica + RWO PVC means the old pod must be gone before
    # the new one mounts. Rolling update would deadlock on the PVC.
    type: Recreate
  selector:
    matchLabels: {{- include "x1agent.selectorLabels" (dict "ctx" . "component" "nats") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "x1agent.selectorLabels" (dict "ctx" . "component" "nats") | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%v|%v" $nats .Values.providers | sha256sum }}
    spec:
      containers:
        - name: nats
          image: {{ $nats.image | quote }}
          args:
            - "-c"
            - "/etc/nats/nats.conf"
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8080
              name: ws
          resources: {{- toYaml $nats.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: server-tls
              mountPath: /etc/nats/tls/server
              readOnly: true
            {{- if $jsEnabled }}
            - name: jetstream
              mountPath: /data
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: nats-config
        - name: server-tls
          secret:
            secretName: nats-server-tls
        {{- if $jsEnabled }}
        - name: jetstream
          persistentVolumeClaim:
            claimName: nats-jetstream-data
        {{- end }}
{{- if $jsEnabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-jetstream-data
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  accessModes: [ "ReadWriteOnce" ]
  {{- if $js.storageClass }}
  storageClassName: {{ $js.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $js.fileStorageSize | default "10Gi" | quote }}
{{- end }}
{{- else }}
{{- /*
Multi-replica StatefulSet path. Each pod gets its own JetStream PV via
volumeClaimTemplates, and they discover each other through the
`nats-headless` service for clustering + RAFT quorum.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "x1agent.selectorLabels" (dict "ctx" . "component" "nats") | nindent 4 }}
  ports:
    - { name: client,  port: 4222, targetPort: 4222 }
    - { name: cluster, port: 6222, targetPort: 6222 }
    - { name: ws,      port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  serviceName: nats-headless
  selector:
    matchLabels: {{- include "x1agent.selectorLabels" (dict "ctx" . "component" "nats") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "x1agent.selectorLabels" (dict "ctx" . "component" "nats") | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%v|%v" $nats .Values.providers | sha256sum }}
    spec:
      containers:
        - name: nats
          image: {{ $nats.image | quote }}
          args:
            - "-c"
            - "/etc/nats/nats.conf"
          ports:
            - { containerPort: 4222, name: client }
            - { containerPort: 6222, name: cluster }
            - { containerPort: 8080, name: ws }
          resources: {{- toYaml $nats.resources | nindent 12 }}
          volumeMounts:
            - { name: config,     mountPath: /etc/nats,            readOnly: true }
            - { name: server-tls, mountPath: /etc/nats/tls/server, readOnly: true }
            {{- if $jsEnabled }}
            - { name: jetstream,  mountPath: /data }
            {{- end }}
      volumes:
        - { name: config,     configMap: { name: nats-config } }
        - { name: server-tls, secret:    { secretName: nats-server-tls } }
  {{- if $jsEnabled }}
  volumeClaimTemplates:
    - metadata:
        name: jetstream
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if $js.storageClass }}
        storageClassName: {{ $js.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $js.fileStorageSize | default "10Gi" | quote }}
  {{- end }}
{{- end }}
---
# NATS config. mTLS with subject-level ACLs by CN.
#
# Two authorized users matching the cert CNs in nats-certs.yaml:
#   x1agent-api       — subscribes to all session events, publishes user input
#   session-sidecar   — publishes its session's events, subscribes to its input
#
# v1 ACL note: `session-sidecar` is shared across all sessions, so the
# CN-based pin doesn't constrain which session-id subjects a sidecar
# can publish to. Per-session certs (deferred — see nats-certs.yaml
# header) would let us narrow this to subject patterns derived from CN.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  labels: {{- include "x1agent.labels" . | nindent 4 }}
data:
  nats.conf: |
    port: 4222
    http_port: 8222

    tls {
      cert_file: "/etc/nats/tls/server/tls.crt"
      key_file:  "/etc/nats/tls/server/tls.key"
      ca_file:   "/etc/nats/tls/server/ca.crt"
      verify:    true
      verify_and_map: true
    }

    {{- if $jsEnabled }}

    # JetStream — durable, replayable subjects. store_dir lives on the
    # PV mounted at /data; emptyDir would defeat the durability point.
    # Limits cap memory + on-disk cap independently; per-stream limits
    # in the bootstrap Job apply within these.
    jetstream {
      store_dir: "/data/jetstream"
      max_memory_store: {{ $js.maxMemoryStore | default "256M" | quote }}
      max_file_store:   {{ $js.maxFileStore   | default "8G"   | quote }}
    }
    {{- end }}

    {{- if gt $replicas 1 }}

    cluster {
      name: x1agent
      port: 6222
      routes: [
        {{- range $i, $_ := until $replicas }}
        nats://nats-{{ $i }}.nats-headless:6222{{- if ne $i (sub $replicas 1) }},{{- end }}
        {{- end }}
      ]
    }
    {{- end }}

    # verify_and_map extracts the username from the client cert. Order
    # of precedence (per NATS server v2.10): Email SAN, URI SAN, then
    # the Subject DN in RFC 2253 form. Our certs (issued by cert-manager
    # from the internal CA) have no email/URI SANs, so the username is
    # the DN — for a cert with only CN=x1agent-api, that's literally
    # "CN=x1agent-api". The user entries below MUST match that form.
    authorization {
      users: [
        {
          user: "CN=x1agent-api"
          permissions: {
            # `agent.>` covers the share-comment + thread-resolved wake
            # subjects published by the share endpoint and consumed by
            # the comment-wake subscriber. Without these, NATS silently
            # rejected the api's own subscription with "Permissions
            # Violation" and the comment-wake never fired — user-added
            # comments never reached the producing agent.
            # `x1.image.build` is the kaniko image-builder queue the
            # api both publishes to and consumes from.
            publish:   { allow: ["x1.session.*.input", "x1.provider.>", "x1.providers.>", "x1.orchestration.>", "agent.>", "x1.image.>"{{- if $jsEnabled }}, "$JS.API.>"{{- end }}] }
            subscribe: { allow: ["x1.session.*.events", "x1.session.*.audit", "agent.>", "x1.image.>", "_INBOX.>"] }
          }
        }
        {
          user: "CN=session-sidecar"
          permissions: {
            # v1: shared cert means any sidecar can publish on any session
            # id. Per-session certs would tighten this. NATS subscribes are
            # narrower since each pod cares about its own session's input.
            #
            # JetStream consumer mechanics: pull-based consumers issue
            # API requests to $JS.API.> (create-or-update / next / info)
            # and acknowledge messages on $JS.ACK.>. Both are *publish*
            # subjects from the client's perspective; the response /
            # delivered messages flow back over _INBOX.> which is
            # already in the subscribe allow list.
            #
            # `x1.session.*.archive` is the Wave 3 split — sidecar
            # publishes a durable copy of every event for forensic
            # replay (rfcs/jetstream-migration.md). Without this
            # permission, every event publish hits a Permissions
            # Violation log line even when the rest of the pipeline
            # is healthy.
            publish:   { allow: ["x1.session.*.events", "x1.session.*.audit", "x1.session.*.archive"{{- if $jsEnabled }}, "$JS.API.>", "$JS.ACK.>"{{- end }}] }
            subscribe: { allow: ["x1.session.*.input", "x1.session.*.presence", "_INBOX.>"] }
          }
        }
        {
          # Shared by every provider Deployment. Subscribes to its
          # subject tree to receive requests; publishes inbox replies.
          # Per-provider certs (CN=provider-graph, CN=provider-messaging)
          # are the v2 tightening — would let a graph pod be denied
          # subscribing to messaging subjects.
          user: "CN=x1agent-provider"
          permissions: {
            publish:   { allow: ["_INBOX.>", "x1.audit.>"] }
            subscribe: { allow: ["x1.provider.>", "_INBOX.>"] }
          }
        }
      ]
    }

    # Browser-facing WebSocket gateway. TLS termination happens at the
    # ingress (Let's Encrypt cert that browsers trust), so this listener
    # speaks plain WS — no in-pod TLS. The ingress carries traffic as
    # https://nats.<base-domain> → ws://nats:8080.
    #
    # Auth: no_auth_user maps anonymous WS clients to CN=x1agent-api.
    # Acceptable for v1 single-user deployments — see ingress.yaml
    # SECURITY NOTE for the auth_callout follow-up that ties WS clients
    # to per-session JWTs.
    websocket {
      port: 8080
      no_tls: true
      no_auth_user: "CN=x1agent-api"
    }
{{- end }}
