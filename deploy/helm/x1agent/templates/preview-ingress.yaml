# Wildcard preview Ingress — every preview deployment in x1-previews
# routes through this single Ingress + cert. Each preview Service the
# preview provider creates is matched by its host (foo.preview.x1agent.com)
# via a separate Ingress rule the provider adds at deploy time, OR by
# wildcard-matching the cert + having the provider create per-preview
# Ingress resources. v1: per-preview Ingresses, this one is just the
# placeholder + cert.
#
# Cert-manager issues *.preview.<domain> via DNS-01 against Cloud DNS.
# The wildcard cert is renewed every ~60d automatically.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: x1agent-preview-wildcard
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  secretName: x1agent-preview-wildcard-tls
  issuerRef:
    name: {{ .Values.tls.clusterIssuer | quote }}
    kind: ClusterIssuer
  dnsNames:
    - {{ printf "*.preview.%s" .Values.baseDomain | quote }}
    - {{ printf "preview.%s" .Values.baseDomain | quote }}
