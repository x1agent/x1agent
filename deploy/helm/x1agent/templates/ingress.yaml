# Ingress for app + api on the install's base domain.
#
# Stack:
#   - Traefik as the Ingress controller (operator helm-installs it
#     before this chart). Same controller as local OrbStack dev, so
#     manifests are portable across environments.
#   - cert-manager for TLS via Let's Encrypt + DNS-01 challenge against
#     Cloud DNS. cert-manager.io/cluster-issuer annotation tells it
#     which ClusterIssuer to use; the Certificate is created separately
#     in cert-manager-issuer.yaml so renewals are decoupled from
#     Ingress lifecycle.
#
# The wildcard preview ingress lives in preview-ingress.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: x1agent-main
  labels: {{- include "x1agent.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer | quote }}
    # The api now serves a long-lived authenticated WebSocket at
    # /api/ws (the replacement for the public NATS exposure that was
    # Traefik serves TLS on websecure and redirects web globally. It
    # upgrades WebSockets automatically; the installer sets its secure
    # entrypoint's idle timeout to one hour for quiet authenticated sockets.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ include "x1agent.appHost" . | quote }}
        - {{ include "x1agent.apiHost" . | quote }}
      # Secret populated by the matching Certificate in cert-manager-issuer.yaml.
      secretName: x1agent-app-api-tls
  rules:
    - host: {{ include "x1agent.appHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
    - host: {{ include "x1agent.apiHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
#
# Removed 2026-05-13: the public NATS WebSocket Ingress at
# nats.<base-domain> is gone. Earlier versions of this chart exposed
# NATS on port 8080 with `no_auth_user: x1agent-api` in nats.conf,
# meaning any internet client could subscribe / publish across every
# subject as the api super-user. P0 security hole; removed entirely.
#
# Browsers reach NATS via the api's authenticated WebSocket bridge at
# wss://api.<base-domain>/api/ws (see packages/api). NATS Service
# stays ClusterIP and is reachable only from api + agent pods (enforce
# via NetworkPolicy in nats-networkpolicy.yaml).
#
# Do NOT re-add this Ingress until a per-user NATS auth_callout
# (or equivalent in-bridge subject filter) is shipped and tested.
{{- if .Values.ingress.apexRedirect.enabled }}
---
# Apex → app subdomain redirect. Enabled per-install via
# `ingress.apexRedirect.enabled` in values.yaml. Catches the bare
# baseDomain and 301s every path to https://app.<baseDomain>/<path>.
# Default off so installs whose apex is owned by a separate property
# (e.g. x1agent.com → marketing) don't accidentally take over that
# hostname; greenfield installs like a fresh tenant on lattice.atomic.health
# flip it on.
#
# Traefik applies the RedirectRegex middleware declared immediately
# below. The app Service is a required no-op backend for this Ingress.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: x1agent-apex-redirect
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  redirectRegex:
    regex: ^https?://[^/]+/.*
    replacement: https://{{ include "x1agent.appHost" . }}/
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: x1agent-apex-redirect
  labels: {{- include "x1agent.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer | quote }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-x1agent-apex-redirect@kubernetescrd" .Release.Namespace | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ .Values.baseDomain | quote }}
      secretName: x1agent-apex-tls
  rules:
    - host: {{ .Values.baseDomain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
{{- end }}
