# ExternalSecret resources binding GSM secrets to a single
# K8s Secret/x1agent-secrets. The api Deployment's `envFrom` reads it.
#
# Prereqs (handled by terraform, not this chart):
#   - External Secrets Operator installed cluster-wide
#   - ClusterSecretStore named after .Values.externalSecrets.clusterSecretStoreName
#     pointing at GSM, authed via Workload Identity (no SA keys)
#   - Each GSM secret named in values.externalSecrets.bindings exists in
#     the install's GCP project. Terraform creates empty secret resources;
#     operator populates values via gcloud or console.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: x1agent-secrets
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
  target:
    name: x1agent-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .Values.externalSecrets.bindings }}
    {{- /*
      Vertex installs do not need ANTHROPIC_API_KEY — Workload Identity
      handles auth. Skip the binding so the GSM secret can be left empty
      and the env var simply isn't projected into the pod.
    */}}
    {{- if and (eq $.Values.anthropic.provider "vertex") (eq .envName "ANTHROPIC_API_KEY") }}
    {{- continue }}
    {{- end }}
    - secretKey: {{ .envName | quote }}
      remoteRef:
        key: {{ .gsmSecretName | quote }}
    {{- end }}
---
# Postgres password lives in its own Secret so the StatefulSet and the
# api both read the same source of truth without coupling unrelated
# rotation windows.
#
# Pre-install/pre-upgrade hook (weight -10) so the ExternalSecret + its
# materialized k8s Secret exist before the migrate Job (weight -5)
# tries to mount POSTGRES_PASSWORD via envFrom. ESO reconciliation is
# async — the migrate Job's wait-for-secret initContainer absorbs the
# few-seconds lag between hook creation and Secret population.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  labels: {{- include "x1agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
  target:
    name: postgres-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: x1agent-postgres-password
