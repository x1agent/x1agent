# cert-manager Issuers + the certs the chart issues.
#
# Two ACME ClusterIssuers (Let's Encrypt prod + staging) for public TLS
# on app/api/preview. Plus a self-signed CA chain for INTERNAL mTLS:
# NATS server + the api/session client certs that talk to it.
#
# The internal CA is its own root, separate from the public Let's
# Encrypt cert chain. Why: public certs aren't designed for client
# auth + can't carry x1agent's NATS subject ACL identities.
#
# Why ClusterIssuer not Issuer: ClusterIssuer is cluster-scoped, so the
# preview Certificates in x1-previews can use the same issuer without
# a separate per-namespace Issuer.
#
# Solver chosen by tls.solver.type:
#   - http01: Let's Encrypt fetches a token over HTTP from the cluster's
#     ingress LB. Works for any DNS provider whose A record points at the
#     LB. Cannot issue wildcards. Default — no Cloud DNS prerequisite.
#   - dns01: cert-manager writes a TXT record into Cloud DNS. Required
#     for *.preview.<base> wildcards. Needs Workload Identity binding the
#     cert-manager SA to a GSA with roles/dns.admin on a Cloud DNS zone
#     matching baseDomain.
#
# Two issuers shipped — staging + prod. Default to prod; flip to
# staging when iterating to avoid Let's Encrypt rate limits (5
# duplicate certs per week per domain set).
{{- $issuerStaging := printf "%s-staging" .Values.tls.clusterIssuer }}
{{- $solverType := default "http01" .Values.tls.solver.type }}
{{- if not (or (eq $solverType "http01") (eq $solverType "dns01")) }}
{{- fail (printf "tls.solver.type must be 'http01' or 'dns01', got %q" $solverType) }}
{{- end }}
{{- $dnsProject := default .Values.cloud.gcp.projectId .Values.tls.solver.dns01.cloudDNSProject }}
{{- $needsDns01 := or (eq $solverType "dns01") .Values.previews.enabled }}
{{- if and $needsDns01 (not $dnsProject) }}
{{- fail "DNS-01 solver (required by previews.enabled or tls.solver.type=dns01) needs tls.solver.dns01.cloudDNSProject or cloud.gcp.projectId" }}
{{- end }}
{{- /*
Hybrid solver render. Two cases worth calling out:

  1. previews.enabled=true + tls.solver.type=http01 (the recommended
     shape for installs that don't want to migrate their existing
     app/api certs to DNS-01): emits a DNS-01 solver scoped to the
     preview zone for the wildcard cert, then an HTTP-01 catch-all for
     app/api. cert-manager picks the longest matching dnsZones
     selector, so *.preview.<base> goes DNS-01 and everything else
     stays HTTP-01.

  2. tls.solver.type=dns01 (entire install on DNS-01): a single DNS-01
     solver, no selector — catches everything. previews.enabled is a
     no-op for solver shape here; the DNS-01 path already covers the
     wildcard.
*/}}
{{- define "x1agent.acmeSolvers" -}}
{{- if and .previewsEnabled (eq .solverType "http01") }}
- dns01:
    cloudDNS:
      project: {{ .dnsProject | quote }}
  selector:
    dnsZones:
      - {{ printf "preview.%s" .baseDomain | quote }}
- http01:
    ingress:
      class: {{ .ingressClass | quote }}
{{- else if eq .solverType "http01" }}
- http01:
    ingress:
      class: {{ .ingressClass | quote }}
{{- else }}
- dns01:
    cloudDNS:
      project: {{ .dnsProject | quote }}
{{- end }}
{{- end }}
{{- $solverArgs := dict "solverType" $solverType "dnsProject" $dnsProject "ingressClass" .Values.ingress.className "previewsEnabled" .Values.previews.enabled "baseDomain" .Values.baseDomain }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.tls.clusterIssuer | quote }}
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.tls.email | quote }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: {{ printf "%s-account" .Values.tls.clusterIssuer | quote }}
    solvers:
      {{- include "x1agent.acmeSolvers" $solverArgs | nindent 6 }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $issuerStaging | quote }}
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.tls.email | quote }}
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: {{ printf "%s-account" $issuerStaging | quote }}
    solvers:
      {{- include "x1agent.acmeSolvers" $solverArgs | nindent 6 }}
---
# NOTE: explicit Certificate for app+api removed. ingress-nginx's
# cert-manager.io/cluster-issuer annotation on the Ingress causes
# cert-manager's ingress-shim to auto-create a Certificate named
# `<Ingress's tls.secretName>` (i.e. `x1agent-app-api-tls`). Having both
# left two Certificates fighting over the same Secret — the explicit
# one always lost with "IncorrectCertificate" + the orchestrator's
# cert-wait phase polled it forever. Source of truth is now solely
# the Ingress annotation.
---
# ── Internal CA chain for NATS mTLS ────────────────────────────────
#
# Selfsigned ClusterIssuer → bootstrap-only, used to sign the root CA.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: x1agent-selfsigned-bootstrap
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
# Root CA Certificate. Signed by the selfsigned bootstrap. cert-manager
# stores it as a Secret named x1agent-internal-ca; the CA-issuer below
# uses that Secret to sign downstream certs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: x1agent-internal-ca
  # MUST live in the cert-manager namespace — ClusterIssuers look up
  # their CA Secret in cert-manager's `--cluster-resource-namespace`
  # (defaults to `cert-manager`). If we put this in the release namespace,
  # the CA-Issuer below fails with "secret not found" + every cert
  # using it stays Pending forever.
  namespace: cert-manager
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  secretName: x1agent-internal-ca
  isCA: true
  commonName: x1agent-internal-ca
  duration: 87600h    # 10y — root CA renewal is operator-driven, not automatic
  renewBefore: 720h   # 30d
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: x1agent-selfsigned-bootstrap
    kind: ClusterIssuer
---
# CA-Issuer that signs the actual NATS server + client certs from the
# x1agent-internal-ca Secret.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: x1agent-internal-ca-issuer
  labels: {{- include "x1agent.labels" . | nindent 4 }}
spec:
  ca:
    secretName: x1agent-internal-ca
