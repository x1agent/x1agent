---
# Ingress for local dev — routes the *.local.x1agent.dev hostnames
# the api/app/preview manifests embed in their env vars.
#
# DNS: *.local.x1agent.dev resolves to 127.0.0.1 (public DNS). OrbStack
# binds Traefik's LoadBalancer Service to localhost ports 80/443,
# so the browser hits the controller directly.
#
# TLS: cert-manager (see cert-manager.yaml) auto-creates the secret
# `x1agent-wildcard` from the local CA Issuer. The CA root is added to
# leaf chain validates.
#
# Per-preview Ingresses live elsewhere (created dynamically by the
# preview provider in the x1-previews namespace). They reuse the same
# cert via the wildcard SAN baked in here.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: x1agent-wildcard
  namespace: x1agent
spec:
  secretName: x1agent-wildcard
  duration: 2160h     # 90 days — cert-manager auto-renews.
  renewBefore: 360h
  commonName: app.local.x1agent.dev
  dnsNames:
    - local.x1agent.dev
    - "*.local.x1agent.dev"
    - "*.preview.local.x1agent.dev"
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: x1agent-local-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: x1agent-dev
  namespace: x1agent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.local.x1agent.dev
        - api.local.x1agent.dev
      secretName: x1agent-wildcard
  rules:
    - host: app.local.x1agent.dev
      http:
        paths:
          # The public administrative MCP is served by the API but uses the
          # app hostname as its stable canonical resource URL.
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 30001
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 30001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 4322
    - host: api.local.x1agent.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 30001
