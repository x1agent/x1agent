# DEV ONLY — plain (no TLS) NATS with WebSocket gateway enabled so the
# browser can subscribe directly. Prod deploys NATS via the nats-io Helm
# chart with mTLS and JetStream persistence; this manifest is not in the
# Helm chart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  labels:
    app: nats
data:
  nats.conf: |
    port: 4222
    http_port: 8222

    # WebSocket gateway — the session viewer uses nats.ws to subscribe
    # to x1.session.{id}.events live. :8080 is the convention for
    # in-cluster dev; prod is fronted by an ingress with TLS.
    websocket {
      port: 8080
      no_tls: true
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app: nats
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
    - name: websocket
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels:
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args:
            - "-c"
            - "/etc/nats/nats.conf"
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/nats
      volumes:
        - name: config
          configMap:
            name: nats-config
