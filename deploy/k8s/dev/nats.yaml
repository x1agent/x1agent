# DEV — NATS with mTLS on :4222 + plain WebSocket on :8080 for the
# browser. The browser can't present a client cert easily so the
# WebSocket path stays open today; it's addressable only from
# localhost (devspace port-forward) and carries session events only.
# Prod deploys NATS via the nats-io Helm chart with full mTLS + the
# WebSocket gateway behind an ingress with its own TLS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  labels:
    app: nats
data:
  nats.conf: |
    port: 4222
    http_port: 8222

    # Stderr-only logging. Sinking to a file path has historically
    # combined badly with kubelet's docker-shim log rotation on
    # OrbStack: kubelet tried to rotate NATS's container log every
    # ~10s and hit "docker does not support reopening container log
    # files", tight-looping and eventually wedging the VM. By capping
    # verbosity here at NATS's own layer (no debug, no trace) and
    # letting the container log scroll naturally, the rotation
    # pressure stays manageable.
    debug: false
    trace: false
    logtime: true

    # Cluster-internal clients (api, sidecars, providers) must
    # present a client cert signed by our dev CA. Without a cert the
    # TLS handshake fails before any NATS protocol runs. The agent
    # container has no cert — which is the whole point.
    tls {
      cert_file: "/etc/nats-tls/server.crt"
      key_file:  "/etc/nats-tls/server.key"
      ca_file:   "/etc/nats-tls/ca.crt"
      verify:    true
      timeout:   2
    }

    # Browser WebSocket — no client cert. Used only by the session
    # viewer; auth is enforced upstream in the app layer.
    websocket {
      port: 8080
      no_tls: true
    }

    # JetStream — durable, replayable subjects layered over NATS-core.
    # store_dir is the file-backed home for stream + consumer state and
    # MUST live on a real PV; emptyDir would defeat the entire point of
    # turning it on. Limits are dev-sized: 256MB in-memory cap for
    # ephemeral streams, 1GB on-disk cap for durable streams. Helm prod
    # values will raise these; the local dev surface is small enough
    # that 1GB covers many days of session-event history.
    jetstream {
      store_dir: "/data/jetstream"
      max_memory_store: 256MB
      max_file_store: 1GB
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-jetstream-data
  labels:
    app: nats
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app: nats
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
    - name: websocket
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels:
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args:
            - "-c"
            - "/etc/nats/nats.conf"
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/nats
            - name: tls
              mountPath: /etc/nats-tls
              readOnly: true
            - name: jetstream
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: nats-config
        - name: tls
          secret:
            secretName: nats-tls
        - name: jetstream
          persistentVolumeClaim:
            claimName: nats-jetstream-data
