# DEV — NATS with mTLS on :4222 + plain WebSocket on :8080 for the
# browser. The browser can't present a client cert easily so the
# WebSocket path stays open today; it's addressable only from
# localhost (devspace port-forward) and carries session events only.
# Prod deploys NATS via the nats-io Helm chart with full mTLS + the
# WebSocket gateway behind an ingress with its own TLS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  labels:
    app: nats
data:
  nats.conf: |
    port: 4222
    http_port: 8222

    # Cluster-internal clients (api, sidecars, providers) must
    # present a client cert signed by our dev CA. Without a cert the
    # TLS handshake fails before any NATS protocol runs. The agent
    # container has no cert — which is the whole point.
    tls {
      cert_file: "/etc/nats-tls/server.crt"
      key_file:  "/etc/nats-tls/server.key"
      ca_file:   "/etc/nats-tls/ca.crt"
      verify:    true
      timeout:   2
    }

    # Browser WebSocket — no client cert. Used only by the session
    # viewer; auth is enforced upstream in the app layer.
    websocket {
      port: 8080
      no_tls: true
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app: nats
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
    - name: websocket
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels:
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args:
            - "-c"
            - "/etc/nats/nats.conf"
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/nats
            - name: tls
              mountPath: /etc/nats-tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nats-config
        - name: tls
          secret:
            secretName: nats-tls
