# DEV ONLY — applied by devspace against OrbStack. Prod path is the Helm
# chart at deploy/helm/x1agent. Differences from prod:
#  - Single replica, Recreate strategy, no HPA
#  - Runs the image's baked /app (node_modules + manifests + source).
#    Devspace file-sync overlays packages/ on top of it for hot reload.
#  - imagePullPolicy: IfNotPresent with a locally-built dev image
#  - Env injected from developer's .env.local via devspace vars; prod uses
#    External Secrets Operator against GSM/AWS SM/Vault
#  - Permissive RBAC sufficient for creating session Jobs; prod tightens
#    per-role bindings and adds NetworkPolicy
#  - No TLS, no ingress, no NATS mTLS — all of those are prod-chart concerns
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x1agent-api
  labels:
    app: x1agent-api
---
# Least-privilege role for the api pod. Three buckets:
#  1. Read own namespace (debugging/self-awareness)
#  2. Create/list/get/delete session Jobs (for the sessions milestone)
#  3. Manage shared-agent-resources StatefulSets, Services, Secrets, and PVCs
# Kept in one role rather than split — it's always one SA's permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: x1agent-api
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["create", "get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: x1agent-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: x1agent-api
subjects:
  - kind: ServiceAccount
    name: x1agent-api
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 30001
      targetPort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: x1agent-api
      containers:
        - name: api
          image: x1agent-api
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 30001
          env:
            - name: DATABASE_URL
              value: postgres://x1agent:x1agent@postgres:5432/x1agent
            - name: API_PORT
              value: "30001"
            - name: API_PUBLIC_URL
              value: https://api.local.x1agent.dev
            - name: PUBLIC_URL
              value: https://app.local.x1agent.dev
            - name: PLATFORM_NAME
              value: x1agent
            - name: NODE_ENV
              value: development
            - name: NATS_URL
              value: nats://nats:4222
            - name: NATS_CA_FILE
              value: /etc/nats-tls/ca.crt
            - name: NATS_CLIENT_CERT
              value: /etc/nats-tls/client.crt
            - name: NATS_CLIENT_KEY
              value: /etc/nats-tls/client.key
          # Secrets:
          # - devspace dev mode injects them via devspace.yaml `dev:` block (its
          #   `env:` overrides identical names from envFrom).
          # - dev:direct creates the Secret from .env.local and pods read it via
          #   envFrom below. `optional: true` keeps the manifest applyable even
          #   when no Secret exists yet (e.g. devspace dev path).
          envFrom:
            - secretRef:
                name: x1agent-dev-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 30001
            initialDelaySeconds: 10
            periodSeconds: 5
          # mTLS to NATS — every pod that talks to NATS mounts the
          # same `nats-tls` Secret today (one shared client cert).
          # Per-cert subject ACLs come in a follow-up slice.
          volumeMounts:
            - name: nats-tls
              mountPath: /etc/nats-tls
              readOnly: true
      volumes:
        - name: nats-tls
          secret:
            secretName: nats-tls
