# DEV ONLY — single-instance Postgres backed by a local-path PVC so
# data survives `orb stop k8s` / OrbStack reboots / pod recreate. The
# manifest used to use emptyDir, which acted like a fresh-DB-on-every-
# restart. Operators kept losing workspace state on cluster bounces;
# the PVC fix means the dev DB is durable for the same reasons the
# JetStream and registry PVCs are.
#
# Prod uses a managed Postgres (Cloud SQL / RDS / Neon) referenced via
# a K8s Secret populated by External Secrets Operator; this manifest
# is not in the Helm chart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app: postgres
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: x1agent
            - name: POSTGRES_USER
              value: x1agent
            - name: POSTGRES_PASSWORD
              value: x1agent
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "x1agent"]
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
