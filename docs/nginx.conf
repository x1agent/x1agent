server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Astro Starlight emits .html files; rewrite clean URLs to those.
  location / {
    try_files $uri $uri/ $uri.html $uri/index.html /404.html;
  }

  # Long-cache hashed assets (Astro fingerprints them); short-cache HTML.
  location ~* \.(js|css|woff2?|svg|png|jpg|webp|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=300";
  }

  error_page 404 /404.html;

  # gzip — Cloud Run terminates compression upstream too, but local
  # gzip cuts CPU vs negotiated brotli for tiny static text.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
