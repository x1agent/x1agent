[tools]
node = "22"
bun = "latest"

[env]
# Load committed defaults first, then developer overrides.
# Both files are optional; mise silently skips missing ones.
_.file = [".env", ".env.local"]

# Scope kubectl/devspace/helm to OrbStack for everything run through mise
# (or in a mise-activated shell inside this directory). Prevents accidental
# deploys to a real cluster.
KUBECONFIG = "{{env.HOME}}/.orbstack/k8s/config.yml"

# Where the app (running on host) finds the cluster-side API.
# devspace port-forwards 30001 from the api pod to localhost.
PUBLIC_API_URL = "http://localhost:30001"

# ----------------------------------------------------------------------------
# One-time-per-cluster setup: ensure the namespace + NATS mTLS Secret exist.
# Runs before any deployment touches the cluster. Idempotent — safe to call
# every dev start. Without this, the NATS pod cannot mount nats-tls and the
# whole stack stalls.
# ----------------------------------------------------------------------------
[tasks."dev:setup"]
description = "Bootstrap namespace + NATS mTLS material (idempotent)"
run = "deploy/scripts/bootstrap-nats-tls.sh"

# ----------------------------------------------------------------------------
# Cluster-side dev: Postgres + api Deployment + file-sync + port-forward.
# Blocks until you Ctrl-C; keep it running in its own terminal.
# ----------------------------------------------------------------------------
[tasks."dev:cluster"]
description = "Start api + postgres in OrbStack with hot file-sync (blocks)"
depends = ["dev:setup"]
run = "devspace dev --namespace x1agent"

[tasks."dev:cluster:stop"]
description = "Tear down the devspace-managed cluster dev stack"
run = "devspace purge --namespace x1agent"

[tasks."dev:cluster:logs"]
description = "Tail api pod logs"
run = "kubectl logs -n x1agent -l app=api -f --tail=200"

# macOS-only: export the Claude Code Max OAuth credentials from the
# Keychain to a file so the Job watcher can mount it into agent pods as
# /root/.claude/.credentials.json. Re-run when the token refreshes (the
# file is also refreshed automatically by Claude Code inside the pod
# because the hostPath mount is read/write).
[tasks."dev:claude-creds"]
description = "Export ~/.claude Max credentials from Keychain for agent pods"
run = """
dest="${HOST_CLAUDE_CREDENTIALS_FILE:-$HOME/.x1agent-dev/claude-credentials.json}"
mkdir -p "$(dirname "$dest")"
security find-generic-password -s "Claude Code-credentials" -a "$USER" -w > "$dest"
chmod 600 "$dest"
echo "Wrote Max credentials to $dest"
echo "Set HOST_CLAUDE_CREDENTIALS_FILE=$dest in your shell or .env.local"
"""

# ----------------------------------------------------------------------------
# Host-side dev: Astro app. Assumes dev:cluster is already running so
# localhost:30001 is port-forwarded.
# ----------------------------------------------------------------------------
[tasks."dev:app"]
description = "Start the Astro app on :4322 (talks to localhost:30001)"
run = "cd packages/app && bun run dev"

# The one-command orchestration: kick the cluster off in a tmux-style
# background, then run the app in the foreground. Ctrl-C stops the app;
# run dev:cluster:stop to tear down the cluster-side stack.
[tasks.dev]
description = "Full local dev: dev:cluster (bg) + dev:app (fg)"
depends = ["dev:setup"]
run = [
  "devspace dev --namespace x1agent &",
  "sleep 6 && cd packages/app && bun run dev",
]

# ----------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------
[tasks.test]
description = "Run all unit + integration tests across packages"
run = """
for pkg in kernel domains/auth domains/workspaces domains/invitations domains/agents domains/github domains/sessions agent api; do
  echo "=== $pkg ==="
  (cd packages/$pkg && bun test) || exit 1
done
"""

[tasks."test:e2e"]
description = "Run Playwright e2e (requires dev stack running)"
run = "cd packages/app && bun run test:e2e"

# ----------------------------------------------------------------------------
# Docs site
# ----------------------------------------------------------------------------
[tasks.docs]
description = "Run the docs site locally"
run = "cd docs && npm run dev"

[tasks."docs:build"]
description = "Build the docs site"
run = "cd docs && npm run build"

[tasks."docs:preview"]
description = "Preview the built docs site"
run = "cd docs && npm run preview"

[tasks.review]
description = "Run Claude code review on staged changes"
run = "claude --print .claude/commands/review.md"

[tasks.lint]
description = "Run commitlint on the last commit message"
run = "npx --no-install commitlint --last"
