name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit + application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run pure-logic tests (kernel + domains)
        run: |
          for pkg in kernel domains/auth domains/workspaces domains/invitations; do
            echo "=== $pkg ==="
            (cd packages/$pkg && bun test)
          done

  integration:
    name: Adapter + API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: x1agent
          POSTGRES_USER: x1agent
          POSTGRES_PASSWORD: x1agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://x1agent:x1agent@localhost:5432/x1agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run migrations
        working-directory: packages/api
        run: bun run migrate
      - name: Run API integration tests
        working-directory: packages/api
        run: bun test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: x1agent
          POSTGRES_USER: x1agent
          POSTGRES_PASSWORD: x1agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://x1agent:x1agent@localhost:5432/x1agent
      JWT_SECRET: ci-jwt-secret-not-for-prod
      GOOGLE_OAUTH_CLIENT_ID: placeholder
      GOOGLE_OAUTH_CLIENT_SECRET: placeholder
      ALLOWED_DOMAINS: ""
      AUTH_BYPASS: "true"
      TEST_USER: test@example.com
      PUBLIC_URL: http://localhost:4322
      API_PUBLIC_URL: http://localhost:30001
      PLATFORM_NAME: x1agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Run migrations
        working-directory: packages/api
        run: bun run migrate
      - name: Install Playwright browsers
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: packages/app
        run: bun run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/app/playwright-report
          retention-days: 7
