name: Deploy docs to Cloud Run

# Builds the docs site on every push to main and deploys it to the
# `x1agent-docs` Cloud Run service backing docs.x1agent.com. Runs on
# every main commit (no `paths:` filter) so the docs site can never
# fall behind main HEAD — the workflow is fast enough that the cost
# of running it for non-docs commits is negligible compared to the
# cost of a stale docs site that doesn't reflect what shipped.
#
# No PR previews. They created a class of bug where image-hash-cached
# revisions tagged from a prior PR (`--no-traffic --tag pr-N`) would
# silently hijack the production deploy and pin live traffic to an
# older revision. Removed entirely; if a doc preview is wanted on a
# PR, it's a separate dedicated workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: ${{ vars.DOCS_GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.DOCS_GCP_REGION || 'us-central1' }}
  SERVICE: x1agent-docs
  WIF_PROVIDER: ${{ vars.DOCS_WIF_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ vars.DOCS_WIF_SERVICE_ACCOUNT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # --workspaces=false tells npm to ignore the root package.json's
      # workspace declaration. Required because the monorepo's
      # packages/domains/agent-resources*/package.json files reference
      # sibling workspaces with the "workspace:*" protocol — bun handles
      # it natively, npm does not. docs/ is genuinely standalone (no
      # workspace siblings in its own deps) so installing it without
      # workspace context is correct.
      - name: Install
        working-directory: docs
        run: npm ci --workspaces=false --include-workspace-root=false

      - name: Build (smoke)
        working-directory: docs
        run: npm run build

      - id: auth
        name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy production
        working-directory: docs
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --allow-unauthenticated \
            --quiet

      # Belt-and-suspenders: explicitly roll 100% traffic to the
      # latest revision. Without this, `gcloud run deploy --source .`
      # can silently no-op when its built image hashes the same as a
      # revision that already exists in the service — which leaves
      # traffic pinned to whatever was previously serving 100%, even
      # though the workflow reports success. Cheap, idempotent, makes
      # the deploy actually visible.
      - name: Roll traffic to latest revision
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --to-latest \
            --quiet
